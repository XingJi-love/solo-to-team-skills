<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>四端统一建队台 0.2.2b · 一人成阵</title>
  <link rel="stylesheet" href="builder.css">
  <script src="core.js" defer></script>
  <script src="adapters.js" defer></script>
  <script src="rooms.js" defer></script>
  <script src="template.js" defer></script>
  <script src="zip-store.js" defer></script>
  <script src="workbuddy.js" defer></script>
  <script src="grok-plan.js" defer></script>
  <script src="ds-planner.js" defer></script>
  <script src="ds-runbook.js" defer></script>
  <script src="ds-panel.js" defer></script>
  <script src="hosts.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar"><span data-i="brand">一人成阵</span><a id="lang" href="#en" lang="en">English</a></header>
  <main>
    <section class="heading">
      <div><h1 data-i="title">团队配置编辑器</h1><p data-i="intro">从三席开始，把分工、沟通群和交接方式改成自己团队的做法。</p></div>
      <div class="files"><button type="button" id="import" data-i="import">打开配置</button><button type="button" id="export" class="primary" data-i="export">保存配置文件</button><input type="file" id="document-file" accept=".json,application/json" hidden></div>
    </section>
    <section class="team">
      <label for="team-name" data-i="teamName">团队名称</label><input id="team-name" type="text" autocomplete="off">
      <p id="status" role="status" aria-live="polite"></p>
      <details class="identifier"><summary data-i="fileIdentity">配置文件标识</summary><label for="team-id" data-i="identityHint">同一团队沿用这个标识；制作另一支团队时可更换。</label><input type="text" id="team-id" autocomplete="off" spellcheck="false"></details>
    </section>
    <section id="import-banner" class="banner" hidden><span id="pending-label"></span><button type="button" id="apply-import" data-i="replace">使用这份配置</button><button type="button" id="cancel-import" data-i="cancel">取消</button></section>
    <div class="workbench">
      <aside>
        <nav aria-label="Configuration sections">
          <button type="button" id="tab-role" data-mode="role" data-i="roles">席位</button>
          <button type="button" id="tab-group" data-mode="group" data-i="groups">群组</button>
          <button type="button" id="tab-flow" data-mode="flow" data-i="workflow">交接</button>
        </nav>
        <div id="sidebar"></div>
      </aside>
      <section id="editor" aria-labelledby="editor-title"></section>
    </div>
    <section class="exports unified" id="host-panel" aria-labelledby="hosts-title">
      <div class="export-start"><h2 id="hosts-title"></h2><p id="hosts-hint"></p></div>
      <nav class="hosts" aria-label="Choose host"><button type="button" data-host="maus">OpenMausBot</button><button type="button" data-host="dsh">DeepSeek Harness</button><button type="button" data-host="wb">WorkBuddy</button><button type="button" data-host="grok">Grok Bot</button></nav>
      <div><h3 id="host-format"></h3><p id="host-description"></p><p class="meta" id="source-count"></p></div>
      <div id="host-options"></div><button type="button" id="host-download" class="primary"></button><p id="host-status" role="status" aria-live="polite"></p>
    </section>
    <p class="privacy" data-i="privacy">内容只在此页处理。保存 JSON 后可再次打开编辑；使用时由对应宿主决定账户权限。</p>
    <noscript>本地编辑器需要允许浏览器运行 JavaScript。This offline editor requires JavaScript.</noscript>
  </main>
</body></html>
