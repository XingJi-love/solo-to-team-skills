<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';base-uri 'none';form-action 'none'"><title>替现场负责人验这一单 · Review the handoff</title><style>
:root{--paper:#f2f0e6;--sheet:#fffcf4;--ink:#182e2d;--low:#435b55;--line:#c1c9b8;--green:#14614f;--pale:#e2efe2;--amber:#96451e;--warm:#fae7d1}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 'PingFang SC','Microsoft YaHei',system-ui,sans-serif}main,header,footer{max-width:1010px;margin:auto;padding-left:clamp(14px,4vw,42px);padding-right:clamp(14px,4vw,42px)}header{display:flex;justify-content:space-between;align-items:center;padding-top:23px;color:var(--green);font-size:.88rem;font-weight:650}button{font:inherit;color:var(--ink);cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,h2:focus-visible{outline:3px solid #166c9b;outline-offset:3px}button:disabled{cursor:default}#lang,.sub{background:transparent;border:1px solid #80968c;border-radius:4px;padding:5px 11px}h1{max-width:850px;font:600 clamp(32px,6vw,62px)/1.12 'Songti SC',Baskerville,Georgia,serif;letter-spacing:-.025em;margin:.4em 0 .16em}.lead{max-width:750px;color:var(--low);font-size:1.04rem;margin:0 0 21px}.layout{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(0,1.4fr);gap:22px;align-items:start}.brief{background:#1a423b;color:#fbf9ef;padding:20px;border-radius:3px}.brief p{color:#d8e5d9}.brief h2{font:600 21px/1.35 'Songti SC',Georgia,serif;margin:0}.brief h3{font-size:.83rem;font-weight:500;color:#d3e5d8;margin:14px 0 4px}.fig{font-family:Baskerville,Georgia,serif;font-size:34px;letter-spacing:-.025em}.money{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid #5c776b}.money.small{font-size:.9rem}.money.small b{font-size:18px;font-weight:650}.trail{margin:17px 0 0;padding:0 0 0 18px;border-left:2px solid #bed6c2;list-style:none}.trail li+li{margin-top:7px}.trail b{display:block;font-size:.8rem;font-weight:500;color:#d3e5d8}.trail span{font-size:1rem;font-weight:650}.paper{background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--green);box-shadow:0 4px 0 #e4e1d4;padding:17px clamp(13px,3vw,28px) 21px;border-radius:2px}.paper h2{font-size:clamp(21px,3vw,28px);line-height:1.28;margin:4px 0 11px}.paper p{margin:.4em 0}.meta,.hint{font-size:.86rem;color:var(--low)}.tag{display:inline-block;padding:2px 8px;border:1px solid #98afa1;border-radius:20px;color:var(--green);font-size:.75rem;font-weight:650}.cta,.decision{border-radius:4px;border:1px solid var(--green);padding:9px 14px;font-weight:650}.cta,.decision.primary{color:#fff;background:var(--green)}.decision{color:var(--green);background:var(--sheet)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 2px}fieldset{margin:15px 0 11px;padding:0;border:0}legend{font-weight:650;margin-bottom:7px}.scenarios{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{display:flex;align-items:center;gap:6px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;cursor:pointer}.choice:has(input:checked){background:var(--pale);border-color:var(--green)}input[type=radio]{accent-color:var(--green);width:17px;height:17px;flex-shrink:0}.fact,.feedback{margin:14px 0;padding:10px 12px;border-left:3px solid var(--green);background:var(--pale)}.feedback{background:var(--warm);border-color:var(--amber)}.feedback strong{display:block;margin-bottom:3px}.eq{font-variant-numeric:tabular-nums;font-weight:700}details{margin-top:13px;border-top:1px solid var(--line);padding:8px 0 0}summary{cursor:pointer;font-weight:620;min-height:32px}blockquote{margin:7px 0;padding:5px 10px;border-left:2px solid var(--line);color:var(--ink)}.excerpt{font-size:.91rem}.excerpt strong{display:block;margin-top:9px}.result{background:#edf1e9;padding:11px 13px;margin:13px 0}.foot{margin:22px 0 30px;border-top:1px solid var(--line);padding-top:10px;color:var(--low);font-size:.83rem}a{color:var(--green)}.plain{border:0;padding:6px 0;text-decoration:underline;background:none;color:var(--green)}[hidden]{display:none!important}
@media(max-width:680px){header{padding-top:11px}.layout{display:flex;flex-direction:column;gap:12px}.brief,.paper{width:100%}.brief{padding:11px 13px}.brief h2{font-size:19px}.brief h3{margin:6px 0 0}.brief .data{display:flex;align-items:baseline;gap:15px;flex-wrap:wrap}.money{border:0;padding:1px 0;gap:4px}.fig{font-size:23px}.money.small b{font-size:15px}.trail{display:flex;gap:16px;padding:4px 0 0;margin:6px 0 0;border:0;border-top:1px solid #5c776b}.trail li,.trail li+li{margin:0}.trail span{font-size:.9rem}.trail b{font-size:.72rem}.lead{margin-bottom:12px;font-size:.94rem}h1{margin-top:15px}.scenarios{gap:5px}.choice{padding:6px;font-size:.92rem}.actions button{min-height:42px}}
</style></head><body><header><span id="brand"></span><button type="button" id="lang">English</button></header><main><h1 id="title"></h1><p class="lead" id="intro"></p>
<div class="layout"><aside class="brief" aria-label="Case"><h2 id="case"></h2><h3 id="event"></h3><div class="data"><div class="money"><span id="spend"></span><strong class="fig">¥1,464</strong></div><div class="money small"><span id="limit"></span><b>¥1,500</b></div><div class="money small"><span id="left"></span><b>¥36</b></div></div><ul class="trail"><li><b id="receiptT"></b><span id="receipt"></span></li><li><b id="reviewT"></b><span id="review"></span></li></ul></aside><article class="paper" aria-live="polite"><span class="tag" id="stamp"></span><h2 tabindex="-1" id="question"></h2><div id="stage"></div></article></div></main><footer><p class="foot" id="foot"></p></footer>
<script>
'use strict';
const $=n=>document.getElementById(n);const cn=()=>lang==='zh';let lang=location.hash==='#en'?'en':'zh',received=false,choice=null,verdict=null;
const t=(c,e)=>cn()?c:e, put=(name,c,e)=>$(name).textContent=t(c,e);
const button=(c,e,fn,kind='decision')=>{const b=document.createElement('button');b.type='button';b.className=kind;b.textContent=t(c,e);b.onclick=fn;return b};
const add=(root,tag,text,klass)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(klass)e.className=klass;root.append(e);return e};
function original(root,both){
const d=add(root,'details');add(d,'summary',both?t('打开 R1 / R2 原表对照','Open the R1 / R2 comparison'):t('打开 R1 原表摘录','Open the R1 source cells'));
const box=add(d,'div',undefined,'excerpt');
add(box,'strong',t('C7 · 未使用的备用材料','C7 · Unused reserve kit'));add(box,'blockquote',t('R1 应交：「1 套」。','R1 expected: “1 kit.”'));
if(both)add(box,'blockquote',t('R2 应交：「1 套（未动用）／0 套（已动用，注明桌号与时间）」。','R2 expected: “1 if unused / 0 if used; record the table and time.”'));
add(box,'strong',t('A4 · 名牌备品','A4 · Spare badges'));add(box,'blockquote',t('R1 应交：「6 张」。同版分发责任表写明，6 张随签到台，由现场志愿者保管。','R1 expected: “6 badges.” Its distribution table assigns those six at the sign-in desk to the floor volunteer.'));
if(both)add(box,'blockquote',t('R2 应交：「—」。备注：「现场志愿者自 14:00 起保管，随签到台，不纳入本次协调员→志愿者移交」。','R2 expected: “—.” The floor volunteer has held the badges at check-in since 14:00. They are excluded from the coordinator-to-volunteer transfer.'));
add(box,'p',t('来源为 MAP-24-R1、MAP-24-R2 现场责任与交接清单。','Source: the on-site handoff sheets in MAP-24-R1 and MAP-24-R2. English excerpts are translations.'),'hint');return d;}
function focusQ(){requestAnimationFrame(()=>$('question').focus({preventScroll:true}))}
function draw(focus=false){
document.documentElement.lang=cn()?'zh-CN':'en';document.title=t('替现场负责人验这一单','Review the handoff');$('lang').textContent=t('English','中文');
put('brand','一人成阵 · 免模型练习','Solo to Team · No-model exercise');put('title','替现场负责人验这一单','Would you sign this handoff?');
put('intro','工作坊将散场。你是当班负责人，桌上的交接单已经送到。','The workshop is wrapping up. You are on duty, and the handoff sheet has arrived.');
put('case','街区地图共创工作坊','Neighbourhood map workshop');put('event','24 人 · 6 张工作桌','24 participants · 6 tables');
put('spend','预算合计','Planned total');put('limit','预算上限','Cap');put('left','余量','Left');
put('receiptT','收件','Receipt');put('reviewT','验收','Review');$('receipt').textContent=received?t('R1 已收到','R1 received'):t('待签收','Awaiting receipt');$('review').textContent=verdict?t('已核点数；整单见下','Count checked; see full verdict'):t('待判断','Open');$('stamp').textContent=received?'MAP-24-R1 · C7':'MAP-24-R1';
const box=$('stage');box.replaceChildren();
if(!received){put('question','你收到哪一版？','Which version arrived?');add(box,'p',t('生产官交来了 24 人执行包 R1。预算可复算，但你还没核对备用材料和名牌由谁交。先确认收到了这份文件。','Production sent R1 of the 24-person event pack. The budget adds up. You have yet to check the spare kit and who holds the badges. Start by acknowledging the file.'));
const act=add(box,'div',undefined,'actions');act.append(button('签收 R1','Acknowledge R1',()=>{received=true;draw(true)},'cta'));original(box,false);
}else{put('question','C7 这次数量能签吗？','Can you sign off this count?');
add(box,'p',t('C7 是“未使用的备用材料”。R1 把应交数固定写为「1 套」。选一个现场情况，判断这一格能否按单点收。','Row C7 is for the unused reserve kit. R1 always expects one. Pick a situation and judge this row for that count.'));
const field=add(box,'fieldset');add(field,'legend',t('选择演示情境','Choose a hypothetical situation'));const opts=add(field,'div',undefined,'scenarios');
for(const key of ['used','unused']){const l=add(opts,'label',undefined,'choice'),radio=add(l,'input');radio.type='radio';radio.name='scenario';radio.value=key;radio.checked=choice===key;l.append(document.createTextNode(key==='used'?t('备品已领用','Spare used'):t('备品未领用','Spare unused')));radio.onchange=()=>{choice=key;verdict=null;draw();requestAnimationFrame(()=>document.querySelector('input[value="'+key+'"]').focus({preventScroll:true}))}}
if(choice){const used=choice==='used';add(box,'p',used?t('演示设定：备品已按计划领用，台账记有桌号和时间；实点 0 套。','Scenario: the spare was issued as planned. The table and time are recorded; zero kits remain.'):t('演示设定：备品没有领用，实点 1 套。','Scenario: the spare was not issued; one kit remains.'),'fact');
const acts=add(box,'div',undefined,'actions');for(const v of ['pass','revise'])acts.append(button(v==='pass'?'通过本格点数':'退修本格点数',v==='pass'?'Accept this count':'Return this count',()=>{verdict=v;draw();requestAnimationFrame(()=>$('response').focus({preventScroll:false}))},'decision'));
if(verdict){const ok=verdict===(used?'revise':'pass'),feedback=add(box,'div',undefined,'feedback');feedback.id='response';feedback.tabIndex=-1;
add(feedback,'strong',ok?t('你的判断与这次实点相符。','Your decision fits this count.'):used?t('再看“已按计划领用”。','Look again at the recorded issue.'):t('就这次点数，实物与应交相符。','For this count, the stock matches the expected quantity.'));
add(feedback,'p',used?t('R1：实点 0 − 应交 1 = −1，会把合法领用写成短缺。R2 按领用记录应交 0，实点 0，差异为 0。','R1: counted 0 − expected 1 = −1. A legitimate issue looks like a loss. Under R2 the recorded issue makes the expected count zero, so the difference is zero.'):t('R1：实点 1 − 应交 1 = 0，这一次 C7 能签。若备品已正常领用，R1 的写法就会出错。','R1: counted 1 − expected 1 = 0. This count can be signed. The same fixed wording would fail after a legitimate issue.'),'eq');
const full=add(box,'div',undefined,'result');add(full,'strong',t('整份 R1 仍须退修','The full R1 still needs revision'));
add(full,'p',t('A4 把 6 张备用名牌列在协调员的移交单上。志愿者从签到时起就保管着它们；让协调员再交 6 张，会登记一笔没有发生的移交。原审核官退回这两处，生产官修成 R2，审核官重开同版后通过，首席交回。','A4 asks the coordinator to transfer six spare badges. The volunteer has held them since check-in. Signing would record a transfer that never took place. In the recorded run the reviewer returned both issues, production revised R2, the reviewer reopened it and the lead delivered it.'));
original(box,true);const again=add(box,'div',undefined,'actions');again.append(button('试另一种情况','Try the other situation',()=>{choice=used?'unused':'used';verdict=null;draw(true)},'sub'),button('重新签收','Start again',()=>{received=false;choice=null;verdict=null;draw(true)},'plain'));
}else original(box,false);
}else original(box,false);}
put('foot','案例取自一次 WorkBuddy 团队对虚构活动的实测留件。你在本地复核摘录；两个现场库存情况是练习设定。全程无需模型、账户或联网。','Based on retained files from a WorkBuddy team run with a fictional activity brief. This local exercise replays the records using two hypothetical inventory situations. No model, account or connection is needed.');
if(focus)focusQ();
}
$('lang').onclick=()=>{lang=cn()?'en':'zh';draw();$('lang').focus()};draw();
</script></body></html>
